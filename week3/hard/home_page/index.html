<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>Today Task</h1>
    <div id="element">
        <input  id="inp" type="text" placeholder="Enter todo here">
        <button id="addNew"  onclick="addTodo()" >+</button>
      </div>
   <div class="container">
    <div id="toDolist">
      <h3 class="headText">Todo List</h3>
    </div>
    <div id="inProgress">
     <h3 class="headText">In Progress</h3>
    </div>
    <div id="done">
    <h3 class="headText">Done</h3>
    </div>
   </div>
    <script src="script.js"></script>
</body>
</html>
